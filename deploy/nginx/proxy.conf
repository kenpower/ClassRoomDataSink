# Optional front proxy (the `proxy` compose service). Routes /api, /sdk and /admin.
# In the DMZ, terminate TLS here (see roomsink-tls.conf.example) or in the host's nginx.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream roomsink_api   { server api:3000;   keepalive 32; }
upstream roomsink_admin { server admin:8080; keepalive 8; }

server {
    listen 8080;
    server_tokens off;

    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;

    # Optional IP allowlist, e.g. for staff routes only:
    # location /api/v1/admin/ { allow 10.0.0.0/8; deny all; ... }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    # Event writes: 8 KB max (batch); single events are checked at 2 KB by the API.
    location ~ ^/api/v1/rooms/[^/]+/events$ {
        client_max_body_size 8k;
        proxy_pass http://roomsink_api;
    }

    # Live WebSocket.
    location ~ ^/api/v1/rooms/[^/]+/live$ {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_pass http://roomsink_api;
    }

    # Exports stream; don't buffer them.
    location ~ ^/api/v1/rooms/[^/]+/export$ {
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://roomsink_api;
    }

    location /api/ { proxy_pass http://roomsink_api; }
    location /sdk/ { proxy_pass http://roomsink_api; }
    location /admin/ { proxy_pass http://roomsink_admin; }
    location = / { return 302 /admin/; }

    # /healthz, /readyz and /metrics are deliberately not routed (internal network only).
    location / { return 404; }
}
